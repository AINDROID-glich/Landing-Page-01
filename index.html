<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #191919;
    }

    header h2 {
      color: #8b5cf6;
    }

    .hero {
      padding: 100px 20px;
      background: linear-gradient(135deg, #111, #4c1d95);
    }

    .hero h1 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    .hero p {
      color: #ddd;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 15px 25px;
      background: #8b5cf6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .jogos {
      padding: 60px 20px;
    }

    .jogos h2 {
      margin-bottom: 30px;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      width: 250px;
      padding: 30px;
      background: #222;
      border-radius: 10px;
    }

    .card h3 {
      margin-bottom: 10px;
      color: #a78bfa;
    }

    footer {
      padding: 20px;
      background: #191919;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h2>🎮 GameZone</h2>
  </header>

  <section class="hero">
    <h1>Entre no mundo dos games</h1>
    <p>Descubra jogos incríveis e viva novas aventuras.</p>
    <a href="#jogos" class="btn">Ver jogos</a>
  </section>

  <section class="jogos" id="jogos">
    <h2>Jogos em destaque</h2>

    <div class="cards">

      <div class="card">
        <h3>🔥 Battle Arena</h3>
        <p>Entre em batalhas épicas.</p>
      </div>

      <div class="card">
        <h3>🚀 Space World</h3>
        <p>Explore o espaço e novos planetas.</p>
      </div>

      <div class="card">
        <h3>🧙 Magic Quest</h3>
        <p>Viva uma aventura cheia de magia.</p>
      </div>

    </div>
  </section>

  <footer>
    © 2026 GameZone
  </footer>

</body>
</html>
